- name: Run site check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python -c '
          import os, json, base64
          raw_key = os.environ["GCP_SA_KEY"]
          try:
              d = json.loads(raw_key)
          except Exception:
              # បើទម្រង់មានបញ្ហា double escape
              d = json.loads(raw_key.encode().decode("unicode-escape"))
          
          if "private_key" in d:
              d["private_key"] = d["private_key"].replace("\\n", "\n")
              
          os.environ["GOOGLE_CREDS_B64"] = base64.b64encode(json.dumps(d).encode()).decode()
          import subprocess
          subprocess.run(["python", "check_sites.py"])
          '
