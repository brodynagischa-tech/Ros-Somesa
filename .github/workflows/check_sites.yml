name: Site Check

on:
  schedule:
    # វេនទី ១ - ម៉ោង ០៤:០០ ព្រឹក ម៉ោងកម្ពុជា (UTC+7) = 21:00 UTC ថ្ងៃមុន
    - cron: '0 21 * * *'
    # វេនទី ២ - ម៉ោង ១៣:០០ (1:00 រសៀល) ម៉ោងកម្ពុជា (UTC+7) = 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # អាចចុចដំណើរការដោយដៃពី tab "Actions" លើ GitHub បានផងដែរ

concurrency:
  group: site-check
  cancel-in-progress: false   # បើមាន run មួយកំពុងរត់ រង់ចាំវាចប់សិន កុំឲ្យរត់ព្រមគ្នា (ជៀសវាងសំណួរច្របល់គ្នា)

jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon gspread google-auth

      - name: Run site check
        run: python check_sites.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
