name: Site Check

on:
  schedule:
    # UTC 01:00 = ម៉ោង ០៨:០០ ព្រឹក ម៉ោងកម្ពុជា (UTC+7). កែម៉ោងបានតាមចង់បាន
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # អាចចុចដំណើរការដោយដៃពី tab "Actions" លើ GitHub បានផងដែរ

jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon gspread google-auth

      - name: Run site check
        run: python check_sites.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
